    }
    const q = L7.q, tv = {};
    if (q.tvars) for (const k in q.tvars) tv[k] = t(q.tvars[k]);
    const seen = Object.keys(state.visited).filter(n => +n !== 7).join(', ');
    root.innerHTML =
      '<div class="lvl"><div class="card">' +
        '<p class="says">' + t('L7_from', { n: q.level, name: t('L' + q.level + '_title') }) + '</p>' +
        '<h2 id="l7q">' + t(q.key, Object.assign({}, q.vars, tv)) + '</h2>' +
        (q.tex ? '<div class="mathline" style="font-size:1.5rem;text-align:center">' + tex(q.tex) + '</div>' : '') +
        '<div class="opts" role="group" aria-labelledby="l7q">' + q.opts.map((o, i) =>
          '<button class="btn' + (L7.solved && i === q.ans ? ' right' : L7.tried[i] ? ' tried' : '') + '" data-opt="' + i + '"' +
          (L7.solved || L7.tried[i] ? ' disabled' : '') + '>' + (o.tex !== undefined ? tex(o.tex) : o.key ? t(o.key) : o.txt) + '</button>').join('') + '</div>' +
        (L7.hint && !L7.solved ? '<div class="note">' + em('💡 ') + t(q.hint) + '</div>' : '') +
        '<div class="row">' +
          (L7.solved ? '' : '<button class="btn" id="l7hint">' + em('💡 ') + t('hint') + '</button>') +
          '<button class="btn ' + (L7.solved ? 'primary' : '') + '" id="l7next">' + t(L7.solved ? 'L7_nextQ' : 'L7_skip') + ' ▶</button></div>' +
      '</div>' +
      '<div class="card"><h2>' + t('L7_title') + '</h2><p class="says">' + t('L7_intro') + '</p>' +
        '<div class="read"><div><small>' + t('L7_correct') + '</small><b>' + L7.correct + '</b></div>' +
        '<div><small>' + t('L7_streak') + '</small><b>' + em('🔥 ') + state.streak + '</b></div></div>' +
        '<p class="says clutter">' + t('L7_pool', { list: seen }) + '</p>' +
        '<h3>' + em('⚡ ') + t('L7_speedTitle') + '</h3>' +
        (L7.speed
          ? '<p class="timer" aria-live="off">' + em('⏱ ') + '<span id="l7timer">' + L7.left + '</span> s &nbsp; ' + em('⭐ ', '★ ') + L7.score + '</p><button class="btn" id="l7stop">' + t('L7_speedStop') + '</button>'
          : '<p class="says">' + t('L7_speedAbout') + '</p><button class="btn gold" id="l7speed">' + t('L7_speedStart') + '</button>') +
      '</div></div>';
    $$('[data-opt]', root).forEach(b => b.addEventListener('click', () => L7_answer(+b.dataset.opt)));
    $('#l7next').addEventListener('click', L7_next);
    if ($('#l7hint')) $('#l7hint').addEventListener('click', () => { L7.hint = true; renderLevel(); });
    if ($('#l7speed')) $('#l7speed').addEventListener('click', L7_startSpeed);
    if ($('#l7stop')) $('#l7stop').addEventListener('click', () => { L7_stopSpeed(false); renderLevel(); });
  }
};

/* ================= TRIANGLE TOOLKIT (shared by levels 8, 9 and 10) =================
   One triangle with corners A, B, C. Side a is opposite corner A, and so on.
   Corner positions are in drawing pixels; TRI_S pixels make 1 unit of length.
   The three levels share this triangle, so a shape made in one level carries to the next. */
const TRI = { A: { x: 70, y: 310 }, B: { x: 430, y: 310 }, C: { x: 300, y: 90 }, grab: null, sel: 'C' };
const TRI_S = 40;
const TRI_COL = { a: 'sin', b: 'cos', c: 'hyp', A: 'sin', B: 'cos', C: 'hyp' };   // colour names for sides and angles

/* Side lengths (in units) and angles (in radians) of the current triangle. */
function triGeom() {
  const d = (p, q) => Math.hypot(p.x - q.x, p.y - q.y) / TRI_S;
  const a = d(TRI.B, TRI.C), b = d(TRI.C, TRI.A), c = d(TRI.A, TRI.B);
  const ang = (opp, s1, s2) => Math.acos(clamp((s1 * s1 + s2 * s2 - opp * opp) / (2 * s1 * s2), -1, 1));
  return { a, b, c, A: ang(a, b, c), B: ang(b, c, a), C: ang(c, a, b) };
}
/* A triangle is "valid" if it is not too thin and not too small to read. */
function triValid() {
  const g = triGeom();
  return Math.min(g.A, g.B, g.C) >= 15 * DEG && Math.min(g.a, g.b, g.c) >= 2;
}
function triSet(a, b, c) {
  TRI.A = { x: a[0], y: a[1] }; TRI.B = { x: b[0], y: b[1] }; TRI.C = { x: c[0], y: c[1] };
}
/* If angle C is within 2.5° of a right angle, nudge the moved corner so that C is exactly 90°. */
function triSnapRight(v) {
  if (Math.abs(triGeom().C / DEG - 90) > 2.5) return;
  const A = TRI.A, B = TRI.B, C = TRI.C;
  if (v === 'C') {                                 // C must lie on the circle that has AB as its diameter
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, r = Math.hypot(A.x - B.x, A.y - B.y) / 2, d = Math.hypot(C.x - mx, C.y - my) || 1;
    C.x = mx + (C.x - mx) / d * r; C.y = my + (C.y - my) / d * r;
  } else {                                         // slide the moved corner until its side is square to the other side at C
    const P = TRI[v], Q = v === 'A' ? B : A, len = Math.hypot(Q.x - C.x, Q.y - C.y) || 1;
    const ux = (Q.x - C.x) / len, uy = (Q.y - C.y) / len, k = (P.x - C.x) * ux + (P.y - C.y) * uy;
    P.x -= k * ux; P.y -= k * uy;
  }
}
/* Move corner v to (x, y). If the new triangle would be too thin, the corner stays where it was. */
function triMove(v, x, y, snapRight) {
  const old = { x: TRI[v].x, y: TRI[v].y };
  TRI[v].x = clamp(Math.round(x), 30, 490); TRI[v].y = clamp(Math.round(y), 40, 340);
  if (snapRight) triSnapRight(v);
  if (!triValid()) { TRI[v].x = old.x; TRI[v].y = old.y; }
}
/* Put corner C on the circle with diameter AB, which makes angle C exactly 90°. */
function triRightC() {
  const A = TRI.A, B = TRI.B, C = TRI.C;
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, r = Math.hypot(A.x - B.x, A.y - B.y) / 2, d = Math.hypot(C.x - mx, C.y - my) || 1;
  const nx = mx + (C.x - mx) / d * r, ny = my + (C.y - my) / d * r;
  if (nx < 30 || nx > 490 || ny < 40 || ny > 340) { triSet([130, 300], [410, 100], [130, 100]); return; }
  C.x = nx; C.y = ny;
  if (!triValid()) triSet([130, 300], [410, 100], [130, 100]);
}
/* SVG path for the little arc that marks the angle at V between the lines V–U and V–W. */
function arcAt(V, U, W, r) {
  const a1 = Math.atan2(U.y - V.y, U.x - V.x), a2 = Math.atan2(W.y - V.y, W.x - V.x);
  let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
  return 'M' + (V.x + r * Math.cos(a1)).toFixed(1) + ' ' + (V.y + r * Math.sin(a1)).toFixed(1) +
         'A' + r + ' ' + r + ' 0 0 ' + (d > 0 ? 1 : 0) + ' ' + (V.x + r * Math.cos(a2)).toFixed(1) + ' ' + (V.y + r * Math.sin(a2)).toFixed(1);
}
const xy = p => p.x.toFixed(1) + ' ' + p.y.toFixed(1);
/* The foot of the height dropped from corner P onto the line through Q and R. */
function footOf(P, Q, R) {
  const len = Math.hypot(R.x - Q.x, R.y - Q.y) || 1, ux = (R.x - Q.x) / len, uy = (R.y - Q.y) / len, k = (P.x - Q.x) * ux + (P.y - Q.y) * uy;
  return { x: Q.x + k * ux, y: Q.y + k * uy, k, len };          // k = distance of the foot from Q along the line
}
/* The dashed height from P to the line QR, with its little right-angle mark and (if needed) the extended base. */
function heightSVG(P, Q, R, label) {
  const F = footOf(P, Q, R), h = Math.hypot(P.x - F.x, P.y - F.y) || 1;
  const ux = (R.x - Q.x) / F.len, uy = (R.y - Q.y) / F.len, nx = (P.x - F.x) / h, ny = (P.y - F.y) / h, m = 11;
  let s = '';
  if (F.k < 0) s += '<path class="s-axis s-dash" d="M' + xy(Q) + 'L' + xy(F) + '"/>';
  if (F.k > F.len) s += '<path class="s-axis s-dash" d="M' + xy(R) + 'L' + xy(F) + '"/>';
  const dir = F.k > F.len / 2 ? -1 : 1;                           // draw the right-angle mark on the roomier side
  s += '<path class="s-ink s-tan s-dash" d="M' + xy(P) + 'L' + xy(F) + '"/>' +
       '<path class="s-axis" d="M' + (F.x + dir * ux * m).toFixed(1) + ' ' + (F.y + dir * uy * m).toFixed(1) + 'l' + (nx * m).toFixed(1) + ' ' + (ny * m).toFixed(1) + 'l' + (-dir * ux * m).toFixed(1) + ' ' + (-dir * uy * m).toFixed(1) + '"/>' +
       '<text class="f-tan t-halo" font-size="17" x="' + ((P.x + F.x) / 2 + 8).toFixed(1) + '" y="' + ((P.y + F.y) / 2 + 6).toFixed(1) + '">' + label + '</text>';
  return { svg: s, foot: F, outside: F.k < 0 || F.k > F.len };
}

/* A label beside the line p–q, pushed away from the point G (the middle of the triangle) so it never sits on the line. */
function sideLabel(p, q, G, txt, cls) {
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, d = Math.hypot(mx - G.x, my - G.y) || 1, nx = (mx - G.x) / d, ny = (my - G.y) / d;
  const anchor = nx > 0.35 ? 'start' : nx < -0.35 ? 'end' : 'middle';
  const x = anchor === 'start' ? Math.min(mx + nx * 14, 436) : anchor === 'end' ? Math.max(mx + nx * 14, 84) : clamp(mx, 48, 472);
  return '<text class="' + cls + ' t-halo" font-size="17" text-anchor="' + anchor + '" x="' + x.toFixed(1) + '" y="' + (my + ny * 18 + 6).toFixed(1) + '">' + txt + '</text>';
}

/* Draw the shared triangle. Options: grid (unit squares), under / over (extra SVG below or above the triangle). */
function triSVG(o = {}) {
  const A = TRI.A, B = TRI.B, C = TRI.C, g = triGeom();
  const G = { x: (A.x + B.x + C.x) / 3, y: (A.y + B.y + C.y) / 3 };              // the middle of the triangle
  const away = (p, k) => { const d = Math.hypot(p.x - G.x, p.y - G.y) || 1; return { x: p.x + (p.x - G.x) / d * k, y: p.y + (p.y - G.y) / d * k }; };
  let s = '<rect class="s-bg" width="520" height="380"/>';
  if (o.grid) {
    let d = '';
    for (let x = 30; x <= 490; x += TRI_S) d += 'M' + x + ' 30V350';
    for (let y = 30; y <= 350; y += TRI_S) d += 'M30 ' + y + 'H490';
    s += '<path class="s-grid" d="' + d + '"/>';
  }
  s += '<path class="f-soft" fill="var(--gold-soft)" d="M' + xy(A) + 'L' + xy(B) + 'L' + xy(C) + 'Z"/>' + (o.under || '');
  [['a', B, C], ['b', C, A], ['c', A, B]].forEach(([k, p, q]) => {                // the three sides and their lengths
    s += '<path class="s-line s-' + TRI_COL[k] + '" d="M' + xy(p) + 'L' + xy(q) + '"/>' + sideLabel(p, q, G, k + ' = ' + fmt(g[k], 2), 'f-' + TRI_COL[k]);
  });
  [['A', A, B, C], ['B', B, C, A], ['C', C, A, B]].forEach(([k, v, u, w]) => {    // the three angles
    const lab = away(v, 24), half = g[k] / 2;
    const d1 = Math.hypot(u.x - v.x, u.y - v.y), d2 = Math.hypot(w.x - v.x, w.y - v.y);
    let bx = (u.x - v.x) / d1 + (w.x - v.x) / d2, by = (u.y - v.y) / d1 + (w.y - v.y) / d2; const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;
    const reach = clamp(20 / Math.tan(half), 46, 74);                              // small angles get their number further in
    s += '<path class="s-thin s-' + TRI_COL[k] + '" d="' + arcAt(v, u, w, 28) + '"/>' +
         '<text class="f-' + TRI_COL[k] + ' t-halo" font-size="14" text-anchor="middle" x="' + (v.x + bx * reach).toFixed(1) + '" y="' + (v.y + by * reach + 5).toFixed(1) + '">' + fmt(g[k] / DEG, 0) + '°</text>' +
         '<text font-size="19" text-anchor="middle" x="' + lab.x.toFixed(1) + '" y="' + (lab.y + 7).toFixed(1) + '">' + k + '</text>';
  });
  s += (o.over || '');
  ['A', 'B', 'C'].forEach(k => {
    s += (k === TRI.sel ? '<circle class="halo" cx="' + TRI[k].x.toFixed(1) + '" cy="' + TRI[k].y.toFixed(1) + '" r="22"/>' : '') +
         '<circle class="handle" cx="' + TRI[k].x.toFixed(1) + '" cy="' + TRI[k].y.toFixed(1) + '" r="11"/>';
  });
  return s;
}
/* Make the triangle draggable (mouse, finger, pen) and movable with the keyboard.
   redraw(true) tells the level that the STUDENT moved the triangle, so missions only count real moves. */
function triAttach(svg, redraw, snapRight) {
  makeDraggable(svg, (x, y) => {
    if (!TRI.grab) {                                              // a drag begins: pick up the nearest corner
      let best = '-', bd = 80;
      ['A', 'B', 'C'].forEach(k => { const d = Math.hypot(TRI[k].x - x, TRI[k].y - y); if (d < bd) { bd = d; best = k; } });
      TRI.grab = best; if (best !== '-') TRI.sel = best;
    }
    if (TRI.grab === '-') return;                                 // the press was not near any corner
    triMove(TRI.grab, x, y, snapRight); redraw(true);
  });
  const drop = () => { TRI.grab = null; };
  svg.addEventListener('pointerup', drop); svg.addEventListener('pointercancel', drop);
  svg.addEventListener('keydown', e => {
    const k = e.key.toUpperCase();
    if (k === 'A' || k === 'B' || k === 'C') { TRI.sel = k; redraw(false); return; }
    const d = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    const step = e.shiftKey ? 20 : 4;
    triMove(TRI.sel, TRI[TRI.sel].x + d[0] * step, TRI[TRI.sel].y + d[1] * step, snapRight); redraw(true);
  });
}
/* A small picture of a triangle with the known sides drawn bold and the known angles filled in.
   sides is a string such as 'ab', angles a string such as 'C'. big = the large version for the rule helper. */
function miniTri(sides, angles, right, big) {
  const k = big ? 1 : 0;
  const P = right
    ? { C: { x: [12, 110][k], y: [46, 250][k] }, B: { x: [76, 450][k], y: [46, 250][k] }, A: { x: [12, 110][k], y: [8, 60][k] } }
    : { A: { x: [8, 70][k], y: [46, 250][k] }, B: { x: [76, 450][k], y: [46, 250][k] }, C: { x: [54, 320][k], y: [8, 60][k] } };
  const r = big ? 34 : 11, G = { x: (P.A.x + P.B.x + P.C.x) / 3, y: (P.A.y + P.B.y + P.C.y) / 3 };
  let s = big ? '<rect class="s-bg" width="520" height="300"/>' : '';
  [['A', 'B', 'C'], ['B', 'C', 'A'], ['C', 'A', 'B']].forEach(([v, u, w]) => {
    if (right && v === 'C') { const m = big ? 22 : 8; s += '<path class="s-axis" d="M' + (P.C.x + m) + ' ' + P.C.y + 'v' + (-m) + 'h' + (-m) + '"/>'; return; }
    if (angles.includes(v)) s += '<path fill="var(--gold)" opacity=".85" d="M' + xy(P[v]) + 'L' + arcAt(P[v], P[u], P[w], r).slice(1) + 'Z"/>';
  });
  [['a', 'B', 'C'], ['b', 'C', 'A'], ['c', 'A', 'B']].forEach(([n, p, q]) => {
    const on = sides.includes(n);
    s += '<path class="' + (on ? 's-line s-' + TRI_COL[n] : 's-axis s-dash') + '" d="M' + xy(P[p]) + 'L' + xy(P[q]) + '"/>';
    if (big) {
      const mx = (P[p].x + P[q].x) / 2, my = (P[p].y + P[q].y) / 2, d = Math.hypot(mx - G.x, my - G.y) || 1;
      s += '<text class="f-' + (on ? TRI_COL[n] : 'muted') + '" font-size="20" text-anchor="middle" x="' + (mx + (mx - G.x) / d * 20).toFixed(1) + '" y="' + (my + (my - G.y) / d * 20 + 7).toFixed(1) + '">' + n + '</text>';
    }
  });
  if (big) ['A', 'B', 'C'].forEach(v => {
    const d = Math.hypot(P[v].x - G.x, P[v].y - G.y) || 1;
    s += '<text font-size="20" text-anchor="middle" x="' + (P[v].x + (P[v].x - G.x) / d * 22).toFixed(1) + '" y="' + (P[v].y + (P[v].y - G.y) / d * 22 + 7).toFixed(1) + '">' + v + '</text>';
  });
  return big ? s : '<svg class="mini-tri" viewBox="0 0 84 54" aria-hidden="true">' + s + '</svg>';
}

/* ================= LEVEL 8 — SINE RULE =================
   a / sin A = b / sin B = c / sin C, for every triangle. */
const L8 = { tab: 'ratios', circle: false, amb: { A: 35, b: 7, a: 3 } };

function L8_draw(byStudent) {                     // byStudent = true when the student has just moved something
  const svg = $('#l8svg'); if (!svg) return;
  if (L8.tab === 'when') { L8_drawAmb(byStudent); return; }
  const g = triGeom(), A = TRI.A, B = TRI.B, C = TRI.C;

  if (L8.tab === 'ratios') {
    let under = '';
    if (L8.circle) {                                               // the circle through all three corners
      const d = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
      const qa = A.x * A.x + A.y * A.y, qb = B.x * B.x + B.y * B.y, qc = C.x * C.x + C.y * C.y;
      const ox = (qa * (B.y - C.y) + qb * (C.y - A.y) + qc * (A.y - B.y)) / d, oy = (qa * (C.x - B.x) + qb * (A.x - C.x) + qc * (B.x - A.x)) / d;
      const r = Math.hypot(A.x - ox, A.y - oy);
      under = '<circle class="s-thin s-gold s-dash" cx="' + ox.toFixed(1) + '" cy="' + oy.toFixed(1) + '" r="' + r.toFixed(1) + '"/>' +
              '<path class="s-thin s-gold" d="M' + xy(A) + 'L' + (2 * ox - A.x).toFixed(1) + ' ' + (2 * oy - A.y).toFixed(1) + '"/>';
    }
    svg.innerHTML = triSVG({ under });
    const common = g.a / Math.sin(g.A);
    ['a', 'b', 'c'].forEach(k => {                                 // update the three bars; they glide to the same length
      const K = k.toUpperCase(), v = g[k] / Math.sin(g[K]);
      $('#l8f_' + k).innerHTML = tex('\\dfrac{' + col(TRI_COL[k], k) + '}{\\sin ' + K + '}=\\dfrac{' + col(TRI_COL[k], fmt(g[k], 2)) + '}{' + fmt(Math.sin(g[K]), 3) + '}');
      $('#l8b_' + k).style.width = clamp(v / 24 * 100, 4, 100).toFixed(1) + '%';
      $('#l8v_' + k).textContent = fmt(v, 2);
    });
    $('#l8note').innerHTML = em('✅ ', '✓ ') + t('L8_same') + (L8.circle ? ' ' + t('L8_circleNote') + ' (' + fmt(common, 2) + ')' : '');
    if (byStudent && Math.max(g.A, g.B, g.C) > 90.5 * DEG) mission(8, 0);
  }

  if (L8.tab === 'height') {
    const H = heightSVG(C, A, B, 'h'), F = H.foot;
    const under = '<path fill="var(--cos)" opacity=".16" d="M' + xy(A) + 'L' + xy(C) + 'L' + xy(F) + 'Z"/>' +
                  '<path fill="var(--sin)" opacity=".16" d="M' + xy(B) + 'L' + xy(C) + 'L' + xy(F) + 'Z"/>';
    svg.innerHTML = triSVG({ under, over: H.svg });
    const h = g.b * Math.sin(g.A);
    $('#l8out').innerHTML =
      '<div class="mathline">' + tex(col('tan', 'h') + '=' + col('cos', 'b') + '\\sin A=' + col('cos', fmt(g.b, 2)) + '\\times ' + fmt(Math.sin(g.A), 3) + '=' + col('tan', fmt(h, 2))) + '</div>' +
      '<div class="mathline">' + tex(col('tan', 'h') + '=' + col('sin', 'a') + '\\sin B=' + col('sin', fmt(g.a, 2)) + '\\times ' + fmt(Math.sin(g.B), 3) + '=' + col('tan', fmt(g.a * Math.sin(g.B), 2))) + '</div>' +
      '<p class="says">' + t('L8_hLine') + '</p>' +
      '<div class="mathline">' + tex('\\dfrac{' + col('sin', 'a') + '}{\\sin A}=\\dfrac{' + col('cos', 'b') + '}{\\sin B}', true) + '</div>' +
      (H.outside ? '<div class="note">' + t('L8_hObtuse') + '</div>' : '');
  }
  const r = $('#l8read');
  if (r) r.innerHTML = ['A', 'B', 'C'].map(k => '<div><small class="c-' + TRI_COL[k] + '">' + k + '</small><b class="c-' + TRI_COL[k] + '">' + fmt(g[k] / DEG, 1) + '°</b></div>').join('');
}

/* The ambiguous case: angle A and side b are fixed, side a swings from C like a compass. */
function L8_drawAmb(byStudent) {
  const m = L8.amb, S = 26, O = { x: 50, y: 310 }, Ar = m.A * DEG;
  const C = { x: O.x + m.b * S * Math.cos(Ar), y: O.y - m.b * S * Math.sin(Ar) };
  const h = m.b * Math.sin(Ar), foot = m.b * Math.cos(Ar);
  let kind, pts = [];
  if (m.a < h - 0.04) kind = '0';
  else if (m.a <= h + 0.04) { kind = '1r'; pts = [foot]; }
  else { const w = Math.sqrt(m.a * m.a - h * h); if (m.a < m.b) { kind = '2'; pts = [foot + w, foot - w]; } else { kind = '1'; pts = [foot + w]; } }
  const Bp = pts.map(u => ({ x: O.x + u * S, y: O.y }));
  let s = '<rect class="s-bg" width="520" height="380"/>' +
          '<path class="s-axis" d="M' + O.x + ' ' + O.y + 'H505"/>' +
          '<circle class="s-thin s-gold s-dash" cx="' + C.x.toFixed(1) + '" cy="' + C.y.toFixed(1) + '" r="' + (m.a * S).toFixed(1) + '"/>';
  Bp.forEach((P, i) => { s += '<path fill="var(--' + (i ? 'sin' : 'cos') + ')" opacity=".14" d="M' + xy(O) + 'L' + xy(C) + 'L' + xy(P) + 'Z"/>'; });
  s += '<path class="s-thin s-gold" d="' + arcAt(O, { x: O.x + 10, y: O.y }, C, 34) + '"/>' +
       '<text class="f-gold" font-size="15" x="' + (O.x + 46 * Math.cos(Ar / 2)).toFixed(1) + '" y="' + (O.y - 46 * Math.sin(Ar / 2) + 5).toFixed(1) + '">' + m.A + '°</text>' +
       '<path class="s-line s-cos" d="M' + xy(O) + 'L' + xy(C) + '"/>' +
       '<text class="f-cos t-halo" font-size="17" text-anchor="end" x="' + ((O.x + C.x) / 2 - 10).toFixed(1) + '" y="' + ((O.y + C.y) / 2 - 4).toFixed(1) + '">b = ' + m.b + '</text>';
  if (kind === '0') {                                              // too short: side a hangs straight down and misses the base
    s += '<path class="s-line s-sin" d="M' + xy(C) + 'V' + (C.y + m.a * S).toFixed(1) + '"/>' +
         '<text class="f-sin t-halo" font-size="17" x="' + (C.x + 10).toFixed(1) + '" y="' + (C.y + m.a * S / 2 + 6).toFixed(1) + '">a = ' + fmt(m.a, 1) + '</text>';
  }
  Bp.forEach((P, i) => {
    s += '<path class="s-line s-sin' + (i ? ' s-dash' : '') + '" d="M' + xy(C) + 'L' + xy(P) + '"/>' +
         '<circle class="handle" cx="' + P.x.toFixed(1) + '" cy="' + P.y + '" r="8"/>' +
         '<text font-size="18" text-anchor="middle" x="' + P.x.toFixed(1) + '" y="' + (P.y + 28) + '">' + (Bp.length === 2 ? (i ? 'B₂' : 'B₁') : 'B') + '</text>';
  });
  if (Bp.length) s += '<text class="f-sin t-halo" font-size="17" x="' + ((C.x + Bp[0].x) / 2 + 10).toFixed(1) + '" y="' + ((C.y + O.y) / 2).toFixed(1) + '">a = ' + fmt(m.a, 1) + '</text>';
  s += '<path class="s-thin s-tan s-dash" d="M' + xy(C) + 'V' + O.y + '"/>' +
       '<text class="f-tan t-halo" font-size="15" text-anchor="end" x="' + (C.x - 6).toFixed(1) + '" y="' + (O.y - 12) + '">h = ' + fmt(h, 1) + '</text>' +
       '<text font-size="18" text-anchor="middle" x="' + (O.x - 14) + '" y="' + (O.y + 22) + '">A</text>' +
       '<text font-size="18" text-anchor="middle" x="' + C.x.toFixed(1) + '" y="' + (C.y - 12).toFixed(1) + '">C</text>' +
       '<circle class="f-muted" cx="' + C.x.toFixed(1) + '" cy="' + C.y.toFixed(1) + '" r="5"/>';
  $('#l8svg').innerHTML = s;

  const B1 = pts.length ? Math.asin(clamp(h / m.a, -1, 1)) / DEG : null;
  $('#l8AV').textContent = m.A + '°'; $('#l8bV').textContent = m.b; $('#l8aV').textContent = fmt(m.a, 1);
  $('#l8ambOut').innerHTML =
    '<div class="read"><div><small class="c-tan">h = b·sin A</small><b class="c-tan">' + fmt(h, 2) + '</b></div>' +
    '<div><small>' + (kind === '2' ? 'B₁' : 'B') + '</small><b>' + (B1 === null ? '—' : fmt(B1, 1) + '°') + '</b></div>' +
    (kind === '2' ? '<div><small>B₂</small><b>' + fmt(180 - B1, 1) + '°</b></div>' : '') + '</div>' +
    '<div class="note">' + t('L8_amb' + kind) + '</div>';
  if (byStudent && kind === '2') mission(8, 2);
}

/* ================= LEVEL 9 — COSINE RULE =================
   c² = a² + b² − 2ab·cos C. When C = 90° the last part vanishes: Pythagoras.
   Uses the same shared triangle as level 8. */
const L9 = { tab: 'rule', know: { a: false, b: false, c: false, A: false, B: false, C: false }, right: false, got: {} };

function L9_draw(byStudent) {
  const svg = $('#l9svg'); if (!svg) return;
  if (L9.tab === 'helper') { L9_drawHelper(); return; }
  const g = triGeom(), C = TRI.C, deg = g.C / DEG, isRight = Math.abs(deg - 90) < 0.05;
  let over = '';
  if (isRight) {                                                   // the little square that marks a right angle at C
    const u = { x: (TRI.A.x - C.x) / (g.b * TRI_S), y: (TRI.A.y - C.y) / (g.b * TRI_S) }, w = { x: (TRI.B.x - C.x) / (g.a * TRI_S), y: (TRI.B.y - C.y) / (g.a * TRI_S) }, m = 16;
    over = '<path class="s-ink s-thin" d="M' + (C.x + u.x * m).toFixed(1) + ' ' + (C.y + u.y * m).toFixed(1) + 'l' + (w.x * m).toFixed(1) + ' ' + (w.y * m).toFixed(1) + 'l' + (-u.x * m).toFixed(1) + ' ' + (-u.y * m).toFixed(1) + '"/>';
  }
  svg.innerHTML = triSVG({ over });

  const a2 = g.a * g.a, b2 = g.b * g.b, c2 = g.c * g.c, corr = 2 * g.a * g.b * Math.cos(g.C);   // corr = the "correction"
  const corrShown = Math.abs(corr) < 0.005 ? 0 : corr;
  $('#l9nums').innerHTML =
    '<div class="mathline">' + tex(col('hyp', 'c^2') + '=' + col('sin', fmt(g.a, 2) + '^2') + '+' + col('cos', fmt(g.b, 2) + '^2') + '-2(' + fmt(g.a, 2) + ')(' + fmt(g.b, 2) + ')\\cos ' + fmt(deg, 1) + '^\\circ') + '</div>' +
    '<div class="mathline">' + tex(col('hyp', fmt(c2, 2)) + '=' + col('sin', fmt(a2, 2)) + '+' + col('cos', fmt(b2, 2)) + '-' + (corrShown < 0 ? '(' + fmt(corrShown, 2) + ')' : fmt(corrShown, 2)) +
      '\\quad\\Rightarrow\\quad ' + col('hyp', 'c=' + fmt(g.c, 2))) + '</div>';
  // Two bars: a² + b² on top, c² underneath. The striped piece is the correction.
  const top = a2 + b2 + Math.max(0, -corr), scale = 100 / Math.max(top, c2 + Math.max(0, corr));
  const seg = (v, colour) => '<i' + (colour ? ' style="background:var(--' + colour + ');width:' : ' class="gap" style="width:') + (v * scale).toFixed(2) + '%"></i>';
  $('#l9bars').innerHTML =
    '<p class="says" style="margin:0">a² + b² = ' + fmt(a2 + b2, 2) + '</p>' +
    '<div class="stack">' + seg(a2, 'sin') + seg(b2, 'cos') + (corr < 0 ? seg(-corr) : '') + '</div>' +
    '<p class="says" style="margin:0">c² = ' + fmt(c2, 2) + '</p>' +
    '<div class="stack">' + seg(c2, 'hyp') + (corr > 0 ? seg(corr) : '') + '</div>' +
    '<p class="says"><span style="color:var(--gold)">▨</span> ' + t('L9_corr') + ' = ' + fmt(corrShown, 2) + '</p>';
  $('#l9note').textContent = t(isRight ? 'L9_right' : deg < 90 ? 'L9_acute' : 'L9_obtuse');
  $('#l9read').innerHTML = ['A', 'B', 'C'].map(k => '<div><small class="c-' + TRI_COL[k] + '">' + k + '</small><b class="c-' + TRI_COL[k] + '">' + fmt(g[k] / DEG, 1) + '°</b></div>').join('');
  if (byStudent && isRight) mission(9, 0);
  if (byStudent && deg > 95) mission(9, 1);
}

/* ---- "Which rule should I use?" ----
   Looks at what the student knows and returns [sentence id, rule]. rule is 'sine', 'cosine', 'soh' or null. */
function L9_suggest() {
  const k = L9.know;
  const sides = ['a', 'b', 'c'].filter(x => k[x]), angs = ['A', 'B', 'C'].filter(x => k[x] && !(L9.right && x === 'C'));
  const s = sides.length, g = angs.length;
  if (L9.right) return (s >= 2 || (s >= 1 && g >= 1)) ? ['L9_sug_right', 'soh'] : ['L9_sug_rightNeed', null];
  if (s === 0 && g === 3) return ['L9_sug_aaa', null];
  if (s === 0 || s + g < 3) return ['L9_sug_need', null];
  if (s === 3) return g === 0 ? ['L9_sug_sss', 'cosine'] : ['L9_sug_pair', 'sine'];
  if (s === 2) {
    const between = ['a', 'b', 'c'].find(x => !k[x]).toUpperCase();   // the angle between sides a and b is C, and so on
    if (g === 1) return angs[0] === between ? ['L9_sug_sas', 'cosine'] : ['L9_sug_ssa', 'sine'];
    return ['L9_sug_pair', 'sine'];
  }
  return ['L9_sug_aas', 'sine'];                                       // one side and two (or three) angles
}
function L9_drawHelper() {
  const k = L9.know, sug = L9_suggest();
  const sides = ['a', 'b', 'c'].filter(x => k[x]).join(''), angs = ['A', 'B', 'C'].filter(x => k[x]).join('');
  $('#l9svg').innerHTML = miniTri(sides, angs, L9.right, true);
  $$('[data-know]').forEach(b => {
    const lockedC = L9.right && b.dataset.know === 'C';
    b.setAttribute('aria-pressed', lockedC || !!k[b.dataset.know]);
    b.disabled = lockedC;
  });
  $('#l9right').setAttribute('aria-pressed', L9.right);
  $('#l9sug').innerHTML = (sug[1] ? '<b>' + (sug[1] === 'soh' ? 'SOH-CAH-TOA' : t(sug[1] + 'Rule')) + '</b><br>' : '') + t(sug[0]);
  return sug;
}
function L9_know(key) {                                                // the student toggled a side, an angle or the right-angle switch
  if (key === 'right') L9.right = !L9.right; else L9.know[key] = !L9.know[key];
  const sug = L9_drawHelper();
  say(sug[0]);                                                         // Koni says the suggestion too
  if (sug[1]) { L9.got[sug[1]] = true; if (L9.got.sine && L9.got.cosine && L9.got.soh) mission(9, 2); }
}

/* ================= LEVEL 10 — AREA AND BEARINGS =================
   Area = ½·a·b·sin C (same shared triangle), and a small navigation game:
   a drone flies two legs; the cosine rule gives the distance home, the sine rule the direction. */
const L10 = { tab: 'area', nav: null, fly: 1, timer: null };
const bearing = v => String(Math.round(((v % 360) + 360) % 360)).padStart(3, '0') + '°';   // bearings have three digits: 045°

function L10_draw(byStudent) {
  const svg = $('#l10svg'); if (!svg) return;
  if (L10.tab === 'nav') { L10_drawNav(); return; }
  // Base = side a (from C to B). The height comes down from A onto that base.
  const g = triGeom(), H = heightSVG(TRI.A, TRI.C, TRI.B, 'h');
  svg.innerHTML = triSVG({ grid: true, over: H.svg });
  const h = g.b * Math.sin(g.C), area = 0.5 * g.a * h;
  $('#l10out').innerHTML =
    '<div class="mathline">' + tex(col('tan', 'h') + '=' + col('cos', 'b') + '\\sin C=' + col('cos', fmt(g.b, 2)) + '\\times\\sin ' + fmt(g.C / DEG, 1) + '^\\circ=' + col('tan', fmt(h, 2))) + '</div>' +
    '<div class="mathline"><b>' + t('area') + '</b> ' + tex('=\\tfrac{1}{2}\\,' + col('sin', 'a') + '\\,' + col('tan', 'h') + '=\\tfrac{1}{2}\\,' + col('sin', 'a') + '\\,' + col('cos', 'b') + '\\sin C') + '</div>' +
    '<div class="mathline">' + tex('=\\tfrac{1}{2}(' + col('sin', fmt(g.a, 2)) + ')(' + col('cos', fmt(g.b, 2)) + ')(' + fmt(Math.sin(g.C), 3) + ')=' + fmt(area, 2)) + '</div>' +
    '<div class="read"><div><small class="c-sin">' + t('L10_baseSide') + ' a</small><b class="c-sin">' + fmt(g.a, 2) + '</b></div>' +
    '<div><small class="c-tan">' + t('L10_height') + ' h</small><b class="c-tan">' + fmt(h, 2) + '</b></div>' +
    '<div><small class="c-hyp">C</small><b class="c-hyp">' + fmt(g.C / DEG, 1) + '°</b></div>' +
    '<div><small>' + t('area') + '</small><b>' + fmt(area, 2) + '</b> <small style="display:inline">' + t('L10_units') + '</small></div></div>';
  if (byStudent && Math.abs(area - 12) <= 0.3) mission(10, 0);
}

/* ---- Bearings game ---- */
function L10_stop() { if (L10.timer) { clearInterval(L10.timer); L10.timer = null; } }
function L10_newNav() {
  let n;
  for (;;) {
    const b1 = pick([20, 30, 40, 50, 60, 70, 80]), turn = pick([60, 70, 80, 90, 100, 110, 120]);
    const d1 = pick([4, 5, 6, 7, 8, 9]), d2 = pick([4, 5, 6, 7, 8, 9]);
    const W = 180 - turn;                                               // angle inside the triangle at the turn
    const PT = Math.sqrt(d1 * d1 + d2 * d2 - 2 * d1 * d2 * Math.cos(W * DEG));   // cosine rule: distance from base
    if (d2 * d2 >= d1 * d1 + PT * PT - 1) continue;                      // keep the angle at base acute, so the sine rule gives it directly
    const P = Math.asin(d2 * Math.sin(W * DEG) / PT) / DEG;              // sine rule: angle at base
    n = { b1, b2: b1 + turn, turn, d1, d2, W, PT, P, step: 0, tried: {}, hint: false };
    break;
  }
  const dist = v => fmt(v, 1) + ' km';
  n.opts = [
    options(n.W + '°', shuffle([n.turn + '°', n.b2 + '°', (n.W + 20) + '°', (n.W - 20) + '°', (360 - n.turn) + '°']), 'txt'),
    options(dist(n.PT), shuffle([dist(Math.hypot(n.d1, n.d2)), dist(n.d1 + n.d2), dist(Math.sqrt(n.d1 * n.d1 + n.d2 * n.d2 + 2 * n.d1 * n.d2 * Math.cos(n.W * DEG))), dist(n.PT * 0.8), dist(n.PT * 1.25)]), 'txt'),
    options(bearing(n.b1 + n.P), shuffle([bearing(n.P), bearing(n.b2), bearing(n.b1 + 180 - n.W - n.P), bearing(n.b1 + n.P + 180), bearing((n.b1 + n.b2) / 2)]), 'txt')
  ];
  L10.nav = n;
  L10_stop();
  L10.fly = state.reduceMotion || demoMode ? 1 : 0;                       // the drone flies its route (unless motion is reduced)
  if (L10.fly < 1) L10.timer = setInterval(() => {
    if (!$('#l10svg') || L10.tab !== 'nav') { L10_stop(); L10.fly = 1; return; }
    L10.fly = Math.min(1, L10.fly + 0.02);
    L10_drawNav();
    if (L10.fly >= 1) L10_stop();
  }, 40);
}

function L10_drawNav() {
  const n = L10.nav, dir = b => ({ x: Math.sin(b * DEG), y: -Math.cos(b * DEG) });   // a bearing as a direction on screen (North is up)
  const u1 = dir(n.b1), u2 = dir(n.b2);
  const km = [{ x: 0, y: 0 }, { x: n.d1 * u1.x, y: n.d1 * u1.y }];
  km.push({ x: km[1].x + n.d2 * u2.x, y: km[1].y + n.d2 * u2.y });
  const xs = km.map(p => p.x), ys = km.map(p => p.y);
  const w = Math.max(...xs) - Math.min(...xs) || 1, hgt = Math.max(...ys) - Math.min(...ys) || 1;
  const k = Math.min(380 / w, 230 / hgt, 34);                                        // pixels per km, chosen so the route fits
  const ox = 260 - k * (Math.max(...xs) + Math.min(...xs)) / 2, oy = 215 - k * (Math.max(...ys) + Math.min(...ys)) / 2;
  const [P, W, T] = km.map(p => ({ x: ox + k * p.x, y: oy + k * p.y }));
  const arcN = (V, b, r) => 'M' + V.x.toFixed(1) + ' ' + (V.y - r).toFixed(1) + 'A' + r + ' ' + r + ' 0 ' + (b > 180 ? 1 : 0) + ' 1 ' + (V.x + r * Math.sin(b * DEG)).toFixed(1) + ' ' + (V.y - r * Math.cos(b * DEG)).toFixed(1);
  const at = (V, b, r) => ({ x: V.x + r * Math.sin(b * DEG), y: V.y - r * Math.cos(b * DEG) });
  const label = (p, txt, cls, anchor) => '<text class="' + cls + ' t-halo" font-size="15" text-anchor="' + (anchor || 'middle') + '" x="' + p.x.toFixed(1) + '" y="' + (p.y + 5).toFixed(1) + '">' + txt + '</text>';
  const north = V => '<path class="s-axis s-dash" d="M' + xy(V) + 'v-56"/>' + label({ x: V.x, y: V.y - 68 }, 'N', 'f-muted');
  let grid = '';
  for (let x = 40; x <= 480; x += 40) grid += 'M' + x + ' 20V360';
  for (let y = 20; y <= 360; y += 40) grid += 'M20 ' + y + 'H500';
  let s = '<rect class="s-bg" width="520" height="380"/><path class="s-grid" d="' + grid + '"/>' +
          // compass rose and scale bar
          '<circle class="s-axis" cx="478" cy="52" r="20"/><path class="s-ink s-thin" d="M478 68V34m-6 8l6-9 6 9"/>' + label({ x: 478, y: 18 }, 'N', 'f-muted') +
          '<path class="s-ink s-thin" d="M30 352v8h' + (2 * k).toFixed(1) + 'v-8"/>' + label({ x: 30 + k, y: 344 }, '2 km', 'f-muted') +
          north(P) + north(W) +
          '<path class="s-thin s-gold" d="' + arcN(P, n.b1, 26) + '"/>' + label(at(P, n.b1 / 2, 44), bearing(n.b1), 'f-gold') +
          '<path class="s-thin s-gold" d="' + arcN(W, n.b2, 26) + '"/>' + label(at(W, n.b2 / 2, 46), bearing(n.b2), 'f-gold');
  // the direct line home: a question mark until step 2 is solved
  const G = { x: (P.x + W.x + T.x) / 3, y: (P.y + W.y + T.y) / 3 };                 // the middle of the route triangle
  s += '<path class="' + (n.step >= 2 ? 's-line s-hyp' : 's-thin s-hyp s-dash') + '" d="M' + xy(P) + 'L' + xy(T) + '"/>' + sideLabel(P, T, G, n.step >= 2 ? fmt(n.PT, 1) + ' km' : '?', 'f-hyp') +
       '<path class="s-line s-cos" d="M' + xy(P) + 'L' + xy(W) + '"/>' + sideLabel(P, W, G, n.d1 + ' km', 'f-cos') +
       '<path class="s-line s-sin" d="M' + xy(W) + 'L' + xy(T) + '"/>' + sideLabel(W, T, G, n.d2 + ' km', 'f-sin');
  if (n.step >= 1) {                                                                  // the angle inside the triangle at the turn
    const mid = { x: (P.x + T.x) / 2, y: (P.y + T.y) / 2 }, d = Math.hypot(mid.x - W.x, mid.y - W.y) || 1;
    s += '<path class="s-thin s-tan" d="' + arcAt(W, P, T, 20) + '"/>' + label({ x: W.x + (mid.x - W.x) / d * 38, y: W.y + (mid.y - W.y) / d * 38 }, n.W + '°', 'f-tan');
  }
  if (n.step >= 3) s += '<path class="s-thin s-hyp" d="' + arcN(P, n.b1 + n.P, 62) + '"/>' + label(at(P, (n.b1 + n.P) * 0.72, 80), bearing(n.b1 + n.P), 'f-hyp');
  s += '<circle class="f-muted" cx="' + P.x.toFixed(1) + '" cy="' + P.y.toFixed(1) + '" r="5"/>' + label({ x: P.x - 10, y: P.y + 18 }, t('L10_home'), '', 'end');
  // the drone, somewhere along its route
  const total = n.d1 + n.d2, gone = L10.fly * total, on1 = gone <= n.d1;
  const f = on1 ? gone / n.d1 : (gone - n.d1) / n.d2, from = on1 ? P : W, to = on1 ? W : T;
  const D = { x: from.x + (to.x - from.x) * f, y: from.y + (to.y - from.y) * f };
  s += '<path class="handle" d="M0 -11L8 8L0 3L-8 8Z" transform="translate(' + xy(D) + ') rotate(' + (on1 ? n.b1 : n.b2) + ')"/>';
  if (L10.fly >= 1) s += label({ x: T.x + 14, y: T.y + 4 }, t('L10_drone'), '', 'start');
  $('#l10svg').innerHTML = s;
}

function L10_answer(i) {
  const n = L10.nav, o = n.opts[n.step];
  if (!o || n.tried[i]) return;
  if (i === o.ans) {
    addXP(Object.keys(n.tried).length === 0 && !n.hint ? 10 : 5);
    n.step++; n.tried = {}; n.hint = false;
    if (n.step === 2) mission(10, 1);
    if (n.step === 3) { say('L10_done', { d: fmt(n.PT, 1), b: bearing(n.b1 + n.P) }, true); mission(10, 2); }
    else say(pick(['cheer1', 'cheer2', 'cheer3']), null, true);
  } else {
    n.tried[i] = true;
    say('q_try');                                                                     // a friendly nudge, never "wrong"
  }
  renderLevel();
}

/* ================= LEVEL 11 — TRIANGLE SOLVER (added in V4) =================
   The student types any three facts (at least one side). The solver works out the rest
   and shows each step with the rule it used. Angles are in degrees. */
const L11 = { v: { a: '', b: '', c: '', A: '', B: '', C: '' }, res: null };
const L11_EX = { sas: { a: '5', b: '7', C: '40' }, ssa: { a: '5', b: '7', A: '40' }, sss: { a: '5', b: '6', c: '7' }, aas: { A: '50', B: '60', c: '8' } };
const n2 = v => String(+(+v).toFixed(2));            // 5 → "5", 4.517 → "4.52"
const n1 = v => String(+(+v).toFixed(1));
const dg = v => n1(v) + '^\\circ';
const lowr = s => s.toLowerCase();

/* ---- One step of working. Each function fills in a missing value in T and returns {rule, tex}. ---- */
function stepCosSide(x, T) {                          // two sides and the angle between them → the third side
  const [y, z] = ['a', 'b', 'c'].filter(s => s !== x), X = x.toUpperCase();
  T[x] = Math.sqrt(T[y] * T[y] + T[z] * T[z] - 2 * T[y] * T[z] * Math.cos(T[X] * DEG));
  return { rule: 'cosineRule', tex: x + '^2=' + y + '^2+' + z + '^2-2' + y + z + '\\cos ' + X + '=' + n2(T[y]) + '^2+' + n2(T[z]) + '^2-2(' + n2(T[y]) + ')(' + n2(T[z]) + ')\\cos ' + dg(T[X]) + ',\\quad ' + x + '=' + col(TRI_COL[x], n2(T[x])) };
}
function stepCosAngle(X, T) {                         // three sides → an angle
  const x = lowr(X), [y, z] = ['a', 'b', 'c'].filter(s => s !== x);
  const cs = (T[y] * T[y] + T[z] * T[z] - T[x] * T[x]) / (2 * T[y] * T[z]);
  T[X] = Math.acos(clamp(cs, -1, 1)) / DEG;
  return { rule: 'cosineRule', tex: '\\cos ' + X + '=\\dfrac{' + y + '^2+' + z + '^2-' + x + '^2}{2' + y + z + '}=\\dfrac{' + n2(T[y]) + '^2+' + n2(T[z]) + '^2-' + n2(T[x]) + '^2}{2(' + n2(T[y]) + ')(' + n2(T[z]) + ')}=' + fmt(cs, 3) + ',\\quad ' + X + '=' + col(TRI_COL[X], dg(T[X])) };
}
function stepSineAngle(Y, X, T) {                     // a side-angle pair (x, X) and side y → the (acute) angle Y
  const x = lowr(X), y = lowr(Y), raw = T[y] * Math.sin(T[X] * DEG) / T[x];
  const s = Math.abs(raw - 1) < 1e-9 ? 1 : raw;               // tidy up tiny rounding errors next to exactly 1
  T[Y] = Math.asin(clamp(s, -1, 1)) / DEG;
  return { rule: 'sineRule', tex: '\\sin ' + Y + '=\\dfrac{' + y + '\\sin ' + X + '}{' + x + '}=\\dfrac{' + n2(T[y]) + '\\sin ' + dg(T[X]) + '}{' + n2(T[x]) + '}=' + fmt(s, 3) + ',\\quad ' + Y + '=' + col(TRI_COL[Y], dg(T[Y])) };
}
function stepSineSide(y, X, T) {                      // a side-angle pair (x, X) and angle Y → side y
  const x = lowr(X), Y = y.toUpperCase();
  T[y] = T[x] * Math.sin(T[Y] * DEG) / Math.sin(T[X] * DEG);
  return { rule: 'sineRule', tex: y + '=\\dfrac{' + x + '\\sin ' + Y + '}{\\sin ' + X + '}=\\dfrac{' + n2(T[x]) + '\\sin ' + dg(T[Y]) + '}{\\sin ' + dg(T[X]) + '}=' + col(TRI_COL[y], n2(T[y])) };
}
function stepSum(Z, T) {                              // two angles → the third
  const [X, Y] = ['A', 'B', 'C'].filter(s => s !== Z);
  T[Z] = 180 - T[X] - T[Y];
  return { rule: 'L11_sum', tex: Z + '=180^\\circ-' + dg(T[X]) + '-' + dg(T[Y]) + '=' + col(TRI_COL[Z], dg(T[Z])) };
}
function stepArea(T) {
  return { rule: 'area', tex: '\\tfrac{1}{2}\\,ab\\sin C=\\tfrac{1}{2}(' + n2(T.a) + ')(' + n2(T.b) + ')\\sin ' + dg(T.C) + '=' + n2(0.5 * T.a * T.b * Math.sin(T.C * DEG)) };
}

/* ---- The solver. k holds the known numbers, e.g. {a: 5, b: 7, C: 40}.
   Returns {err: sentenceId} or {kind, sols: [{T, steps}]} with one or two solutions. ---- */
function solveTriangle(k) {
  const sides = ['a', 'b', 'c'].filter(s => k[s] !== undefined), angs = ['A', 'B', 'C'].filter(s => k[s] !== undefined);
  if (sides.length + angs.length !== 3) return { err: sides.length + angs.length === 0 ? 'L11_start' : 'L11_count', n: sides.length + angs.length };
  if (sides.length === 0) return { err: 'L9_sug_aaa' };
  if (angs.reduce((sum, s) => sum + k[s], 0) >= 180) return { err: 'L11_errAngles' };
  const T = Object.assign({}, k), steps = [];

  if (sides.length === 3) {                           // three sides
    const [p, q, r] = [k.a, k.b, k.c].sort((u, v) => u - v);
    if (r >= p + q) return { err: 'L11_errIneq' };
    steps.push(stepCosAngle('A', T), stepCosAngle('B', T), stepSum('C', T), stepArea(T));
    return { kind: 'sss', sols: [{ T, steps }] };
  }
  if (sides.length === 1) {                           // one side and two angles
    const Z = ['A', 'B', 'C'].find(s => k[s] === undefined), X = sides[0].toUpperCase();
    steps.push(stepSum(Z, T));
    ['a', 'b', 'c'].filter(s => s !== sides[0]).forEach(y => steps.push(stepSineSide(y, X, T)));
    steps.push(stepArea(T));
    return { kind: 'aas', sols: [{ T, steps }] };
  }
  // two sides and one angle
  const x3 = ['a', 'b', 'c'].find(s => k[s] === undefined), X = angs[0];
  if (X === x3.toUpperCase()) {                       // the angle is between the two sides
    steps.push(stepCosSide(x3, T));
    const small = sides[0] && k[sides[0]] <= k[sides[1]] ? sides[0] : sides[1];   // the angle opposite the shorter side is never obtuse
    steps.push(stepSineAngle(small.toUpperCase(), X, T));
    steps.push(stepSum(['A', 'B', 'C'].find(s => T[s] === undefined), T), stepArea(T));
    return { kind: 'sas', sols: [{ T, steps }] };
  }
  // the angle is NOT between the two sides: zero, one or two triangles
  const x = lowr(X), y = sides.find(s => s !== x), Y = y.toUpperCase(), Z = x3.toUpperCase();
  const s = k[y] * Math.sin(k[X] * DEG) / k[x];
  if (s > 1 + 1e-9 || (k[X] >= 90 && k[x] <= k[y])) return { err: 'L11_errNone' };
  const first = stepSineAngle(Y, X, T);
  steps.push(first, stepSum(Z, T), stepSineSide(x3, X, T), stepArea(T));
  const sols = [{ T, steps }];
  if (k[x] < k[y] && s < 1 - 1e-9) {                  // the second triangle uses the other angle with the same sine
    const T2 = Object.assign({}, k), st2 = [];
    T2[Y] = 180 - T[Y];
    st2.push({ rule: 'L11_other', tex: Y + '=180^\\circ-' + dg(T[Y]) + '=' + col(TRI_COL[Y], dg(T2[Y])) });
    st2.push(stepSum(Z, T2), stepSineSide(x3, X, T2), stepArea(T2));
    sols.push({ T: T2, steps: st2 });
  }
  return { kind: 'ssa', sols };
}

/* Draw one solved triangle inside the box x0..x0+w (to scale). */
function L11_triSVG(T, x0, w, dashed) {
  const pts = { A: { x: 0, y: 0 }, B: { x: T.c, y: 0 }, C: { x: T.b * Math.cos(T.A * DEG), y: -T.b * Math.sin(T.A * DEG) } };
  const xs = [pts.A.x, pts.B.x, pts.C.x], ys = [pts.A.y, pts.B.y, pts.C.y];
  const bw = Math.max(...xs) - Math.min(...xs) || 1, bh = Math.max(...ys) - Math.min(...ys) || 1;
  const k = Math.min((w - 170) / bw, 180 / bh);
  const ox = x0 + w / 2 - k * (Math.max(...xs) + Math.min(...xs)) / 2, oy = 150 - k * (Math.max(...ys) + Math.min(...ys)) / 2;
  const P = {}; ['A', 'B', 'C'].forEach(v => { P[v] = { x: ox + k * pts[v].x, y: oy + k * pts[v].y }; });
  const G = { x: (P.A.x + P.B.x + P.C.x) / 3, y: (P.A.y + P.B.y + P.C.y) / 3 };
  const push = (p, d) => { const len = Math.hypot(p.x - G.x, p.y - G.y) || 1; return { x: p.x + (p.x - G.x) / len * d, y: p.y + (p.y - G.y) / len * d }; };
  let s = '<path class="f-soft" fill="var(--gold-soft)" d="M' + xy(P.A) + 'L' + xy(P.B) + 'L' + xy(P.C) + 'Z"/>';
  [['a', 'B', 'C'], ['b', 'C', 'A'], ['c', 'A', 'B']].forEach(([n, p, q]) => {
    const m = push({ x: (P[p].x + P[q].x) / 2, y: (P[p].y + P[q].y) / 2 }, 20), dx = m.x - G.x;
    s += '<path class="s-line s-' + TRI_COL[n] + (dashed ? ' s-dash' : '') + '" d="M' + xy(P[p]) + 'L' + xy(P[q]) + '"/>' +
         '<text class="f-' + TRI_COL[n] + ' t-halo" font-size="15" text-anchor="' + (dx > 12 ? 'start' : dx < -12 ? 'end' : 'middle') + '" x="' + m.x.toFixed(1) + '" y="' + (m.y + 5).toFixed(1) + '">' + n + ' = ' + n2(T[n]) + '</text>';
  });
  ['A', 'B', 'C'].forEach(v => {
    const m = push(P[v], 20), dx = m.x - G.x;
    s += '<text class="t-halo" font-size="15" text-anchor="' + (dx > 12 ? 'start' : dx < -12 ? 'end' : 'middle') + '" x="' + m.x.toFixed(1) + '" y="' + (m.y + 5).toFixed(1) + '">' + v + ' ' + n1(T[v]) + '°</text>';
  });
  return s;
}

function L11_read() {                                 // turn the six text boxes into numbers; returns {k} or {err}
  const k = {};
  for (const key of ['a', 'b', 'c', 'A', 'B', 'C']) {
    const raw = String(L11.v[key]).trim().replace(',', '.').replace('°', '');
    if (raw === '') continue;
    const v = parseFloat(raw);
    if (!isFinite(v) || v <= 0 || (key <= 'C' && v >= 180)) return { err: 'L11_bad' };   // 'A','B','C' sort before 'a','b','c'
    k[key] = v;
  }
  return { k };
}

function L11_draw(byStudent) {
  const svg = $('#l11svg'); if (!svg) return;
  const inp = L11_read(), res = inp.err ? { err: inp.err } : solveTriangle(inp.k);
  L11.res = res;
  let g = '<rect class="s-bg" width="520" height="300"/>', out = '';
  if (res.err) {
    g += '<path class="s-axis s-dash" d="M110 240L410 240L300 70Z"/><text class="f-muted" font-size="40" text-anchor="middle" x="270" y="190">?</text>';
    out = '<div class="note">' + t(res.err, { n: res.n }) + '</div>';
  } else {
    const two = res.sols.length === 2;
    res.sols.forEach((sol, i) => { g += L11_triSVG(sol.T, two ? i * 260 : 0, two ? 260 : 520, i === 1); });
    if (two) g += '<path class="s-axis s-dash" d="M260 20V280"/>';
    out = '<div class="note"><b>' + t({ sss: 'o_sss', sas: 'o_sas', aas: 'o_aas', ssa: 'L8_when2t' }[res.kind]) + '</b>' + (two ? '<br>' + t('L11_two') : '') + '</div>';
    let num = 0;
    res.sols.forEach((sol, i) => {
      if (two) out += '<h3>' + t('L11_tri', { n: i + 1 }) + '</h3>';
      sol.steps.forEach(st => { num++; out += '<p class="step-h">' + num + '. ' + t(st.rule) + '</p><div class="mathline">' + tex(st.tex) + '</div>'; });

    if (byStudent) {
      if (res.kind === 'sss') mission(11, 0);
      if (res.kind === 'sas') mission(11, 1);
      if (two) mission(11, 2);
    }
  }
  svg.innerHTML = g;
  $('#l11out').innerHTML = out;
}

/* ================= LEVEL 13 — VECTORS AND COMPONENTS (added in V4) =================
   A bridge to physics: a force (or a velocity) at an angle splits into a sideways part
   (size × cos θ) and an upward part (size × sin θ). Forces are in newtons (N). */
const L13 = { tab: 'resolve', x: 4, y: 2, f1: { m: 4, a: 30 }, f2: { m: 3, a: 120 }, v: 20, ang: 30, fly: 0, timer: null };
const L13_G = 9.8;                                             // gravity, in m/s²

/* An arrow from p to q in one of the drawing colours ('cos', 'sin', 'hyp', ...). */
function arrowSVG(p, q, colour, dashed) {
  const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy);
  if (len < 4) return '';
  const head = Math.min(12, len * 0.6), ux = dx / len, uy = dy / len, bx = q.x - ux * head, by = q.y - uy * head, w = head * 0.5;
  return '<path class="s-line s-' + colour + (dashed ? ' s-dash' : '') + '" d="M' + xy(p) + 'L' + bx.toFixed(1) + ' ' + by.toFixed(1) + '"/>' +
         '<path class="f-' + colour + '" d="M' + xy(q) + 'L' + (bx - uy * w).toFixed(1) + ' ' + (by + ux * w).toFixed(1) + 'L' + (bx + uy * w).toFixed(1) + ' ' + (by - ux * w).toFixed(1) + 'Z"/>';
}
/* "Fx" with the x written small and low, for SVG labels (svgSub) and for HTML (htmlSub). */
const svgSub = (base, low, rest) => base + '<tspan dy="4" font-size="11">' + low + '</tspan><tspan dy="-4">' + (rest || '') + '</tspan>';
const htmlSub = (base, low) => base + '<sub>' + low + '</sub>';
const angle360 = (x, y) => { const d = Math.atan2(y, x) / DEG; return d < -1e-9 ? d + 360 : Math.abs(d) < 1e-9 ? 0 : d; };   // direction, 0° to 360°

function L13_stop() { if (L13.timer) { clearInterval(L13.timer); L13.timer = null; } }

function L13_draw(byStudent) {
  const svg = $('#l13svg'); if (!svg) return;
  const lbl = (x, y, s, cls, anchor) => '<text class="' + (cls || '') + ' t-halo" font-size="15" text-anchor="' + (anchor || 'middle') + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '">' + s + '</text>';
  let g = '<rect class="s-bg" width="520" height="380"/>', out = '';

  if (L13.tab === 'resolve') {
    const O = { x: 260, y: 200 }, U = 28, X = v => O.x + v * U, Y = v => O.y - v * U;
    const tip = { x: X(L13.x), y: Y(L13.y) }, F = Math.hypot(L13.x, L13.y), th = angle360(L13.x, L13.y);
    g += gridLines(-8, 8, -6, 6, X, Y, 1, 1);
    if (F > 0.6) {
      const r = 26, a = th * DEG;
      g += '<path class="s-thin s-gold" d="M' + (O.x + r) + ' ' + O.y + 'A' + r + ' ' + r + ' 0 ' + (th > 180 ? 1 : 0) + ' 0 ' + (O.x + r * Math.cos(a)).toFixed(1) + ' ' + (O.y - r * Math.sin(a)).toFixed(1) + '"/>' +
           lbl(O.x + 44 * Math.cos(a / 2), O.y - 44 * Math.sin(a / 2) + 5, 'θ', 'f-gold');
    }
    g += arrowSVG(O, { x: tip.x, y: O.y }, 'cos') + arrowSVG({ x: tip.x, y: O.y }, tip, 'sin') + arrowSVG(O, tip, 'hyp') +
         lbl((O.x + tip.x) / 2, O.y + (L13.y >= 0 ? 22 : -10), svgSub('F', 'x', ' = ' + fmt(L13.x, 1)), 'f-cos') +
         lbl(tip.x + (L13.x >= 0 ? 10 : -10), (O.y + tip.y) / 2 + 5, svgSub('F', 'y', ' = ' + fmt(L13.y, 1)), 'f-sin', L13.x >= 0 ? 'start' : 'end') +
         '<circle class="halo" cx="' + tip.x + '" cy="' + tip.y + '" r="22"/><circle class="handle" cx="' + tip.x + '" cy="' + tip.y + '" r="11"/>';
    out = '<div class="read"><div><small class="c-hyp">F (' + t('L13_size') + ')</small><b class="c-hyp">' + fmt(F, 2) + ' N</b></div>' +
          '<div><small>θ</small><b>' + fmt(th, 1) + '°</b></div>' +
          '<div><small class="c-cos">' + htmlSub('F', 'x') + ' →</small><b class="c-cos">' + fmt(L13.x, 2) + ' N</b></div>' +
          '<div><small class="c-sin">' + htmlSub('F', 'y') + ' ↑</small><b class="c-sin">' + fmt(L13.y, 2) + ' N</b></div></div>' +
          '<div class="mathline">' + tex(col('cos', 'F_x') + '=' + col('hyp', 'F') + '\\cos\\theta=' + col('hyp', fmt(F, 2)) + '\\times\\cos ' + fmt(th, 1) + '^\\circ=' + col('cos', fmt(L13.x, 2))) + '</div>' +
          '<div class="mathline">' + tex(col('sin', 'F_y') + '=' + col('hyp', 'F') + '\\sin\\theta=' + col('hyp', fmt(F, 2)) + '\\times\\sin ' + fmt(th, 1) + '^\\circ=' + col('sin', fmt(L13.y, 2))) + '</div>' +
          '<p class="says">' + t('L13_back') + '</p>' +
          '<div class="mathline">' + tex(col('hyp', 'F') + '=\\sqrt{F_x^2+F_y^2},\\qquad\\tan\\theta=\\dfrac{F_y}{F_x}') + '</div>';
    svg.setAttribute('aria-valuetext', 'F ' + fmt(F, 1) + ', θ ' + fmt(th, 0) + '°');
    const p = [Math.abs(L13.x), Math.abs(L13.y)].sort();
    if (byStudent && p[0] === 3 && p[1] === 4) mission(13, 0);
  }

  if (L13.tab === 'add') {
    const O = { x: 260, y: 200 }, U = 14, f1 = L13.f1, f2 = L13.f2;
    const c1 = { x: f1.m * Math.cos(f1.a * DEG), y: f1.m * Math.sin(f1.a * DEG) }, c2 = { x: f2.m * Math.cos(f2.a * DEG), y: f2.m * Math.sin(f2.a * DEG) };
    const R = { x: c1.x + c2.x, y: c1.y + c2.y }, size = Math.hypot(R.x, R.y);
    const P1 = { x: O.x + c1.x * U, y: O.y - c1.y * U }, P2 = { x: O.x + R.x * U, y: O.y - R.y * U };
    g += gridLines(-16, 16, -12, 12, v => O.x + v * U, v => O.y - v * U, 2, 2) +
         arrowSVG(O, P1, 'cos') + arrowSVG(P1, P2, 'sin') + arrowSVG(O, P2, 'hyp') +
         (f1.m ? lbl((O.x + P1.x) / 2, (O.y + P1.y) / 2 - 10, 'F₁', 'f-cos') : '') + (f2.m ? lbl((P1.x + P2.x) / 2 + 12, (P1.y + P2.y) / 2 - 8, 'F₂', 'f-sin') : '') +
         (size > 0.3 ? lbl((O.x + P2.x) / 2 - 12, (O.y + P2.y) / 2 + 20, 'R', 'f-hyp') : '') +
         '<circle class="f-muted" cx="' + O.x + '" cy="' + O.y + '" r="5"/>';
    const row = (name, cls, c) => '<tr><th class="c-' + cls + '">' + name + '</th><td>' + fmt(c.x, 2) + '</td><td>' + fmt(c.y, 2) + '</td></tr>';
    out = '<table class="mini"><tr><th></th><th>→</th><th>↑</th></tr>' + row('F₁', 'cos', c1) + row('F₂', 'sin', c2) + row('R = F₁ + F₂', 'hyp', R) + '</table>' +
          '<div class="read"><div><small class="c-hyp">' + t('L13_resultant') + ' R</small><b class="c-hyp">' + fmt(size, 2) + ' N</b></div>' +
          '<div><small>θ</small><b>' + (size < 0.05 ? '—' : fmt(angle360(R.x, R.y), 1) + '°') + '</b></div></div>' +
          (size < 0.05 && f1.m > 0 ? '<div class="note">' + em('✅ ', '✓ ') + t('L13_cancel') + '</div>' : '');
    ['1m', '1a', '2m', '2a'].forEach(k => { const f = L13['f' + k[0]], el = $('#l13' + k + 'V'); if (el) el.textContent = k[1] === 'm' ? fmt(f.m, 1) + ' N' : f.a + '°'; });
    if (byStudent && size < 0.05 && f1.m > 0) mission(13, 1);
  }

  if (L13.tab === 'launch') {
    const th = L13.ang * DEG, vx = L13.v * Math.cos(th), vy = L13.v * Math.sin(th);
    const T = 2 * vy / L13_G, range = vx * T, maxH = vy * vy / (2 * L13_G);
    const S = 4.4, O = { x: 50, y: 310 }, X = m => O.x + m * S, Y = m => O.y - m * S, hOf = x => x * Math.tan(th) - L13_G * x * x / (2 * vx * vx);
    const now = L13.fly * T, bx = vx * now, by = Math.max(0, vy * now - 0.5 * L13_G * now * now);
    const tip = { x: O.x + vx * 3.2, y: O.y - vy * 3.2 };
    g += '<rect x="0" y="' + O.y + '" width="520" height="70" fill="var(--tan)" opacity=".25"/>' +
         '<path class="s-thin s-hyp s-ghost s-dash" d="' + plotPath(hOf, 0, range, X, Y, 999, 80) + '"/>' +
         (L13.fly > 0 ? '<path class="s-line s-hyp" d="' + plotPath(hOf, 0, bx, X, Y, 999, 60) + '"/>' : '') +
         arrowSVG(O, { x: tip.x, y: O.y }, 'cos') + arrowSVG({ x: tip.x, y: O.y }, tip, 'sin') + arrowSVG(O, tip, 'gold') +
         lbl(tip.x + 8, tip.y - 6, 'v', 'f-gold', 'start') + lbl((O.x + tip.x) / 2, O.y + 20, svgSub('v', 'x'), 'f-cos') + lbl(tip.x + 8, (O.y + tip.y) / 2 + 5, svgSub('v', 'y'), 'f-sin', 'start');
    if (L13.fly >= 1) {                                                               // after landing: mark the range and the greatest height
      g += '<path class="s-thin s-tan s-dash" d="M' + X(range / 2).toFixed(1) + ' ' + O.y + 'V' + Y(maxH).toFixed(1) + '"/>' + lbl(X(range / 2) + 8, Y(maxH / 2), fmt(maxH, 1) + ' m', 'f-tan', 'start') +
           '<path class="s-line s-gold" d="M' + O.x + ' ' + (O.y + 34) + 'H' + X(range).toFixed(1) + '"/>' + lbl(X(range / 2), O.y + 56, fmt(range, 1) + ' m', 'f-gold');
    }
    g += '<circle class="handle" cx="' + X(bx).toFixed(1) + '" cy="' + Y(by).toFixed(1) + '" r="9"/>';
    out = '<div class="read"><div><small class="c-cos">' + htmlSub('v', 'x') + ' →</small><b class="c-cos">' + fmt(vx, 1) + ' m/s</b></div>' +
          '<div><small class="c-sin">' + htmlSub('v', 'y') + ' ↑</small><b class="c-sin">' + fmt(vy, 1) + ' m/s</b></div>' +
          '<div><small>' + t('L13_range') + '</small><b>' + fmt(range, 1) + ' m</b></div>' +
          '<div><small>' + t('L13_maxH') + '</small><b>' + fmt(maxH, 1) + ' m</b></div>' +
          '<div><small>' + t('L13_flight') + '</small><b>' + fmt(T, 2) + ' s</b></div></div>' +
          '<div class="mathline">' + tex(col('cos', 'v_x') + '=v\\cos\\theta=' + L13.v + '\\times\\cos ' + L13.ang + '^\\circ=' + col('cos', fmt(vx, 1)) + ',\\quad ' + col('sin', 'v_y') + '=v\\sin\\theta=' + col('sin', fmt(vy, 1))) + '</div>' +
          '<div class="mathline">' + tex('R=\\dfrac{v^2\\sin 2\\theta}{g}=\\dfrac{' + L13.v + '^2\\times\\sin ' + 2 * L13.ang + '^\\circ}{' + L13_G + '}=' + fmt(range, 1) + '\\text{ m}') + '</div>' +
          '<p class="says">' + t('L13_launchNote') + '</p>';
    $('#l13vV').textContent = L13.v + ' m/s'; $('#l13angV').textContent = L13.ang + '°';
  }
  svg.innerHTML = g;
  $('#l13out').innerHTML = out;
}

function L13_launch() {                                           // the student pressed "Launch!"
  L13_stop();
  const landed = () => { L13.fly = 1; L13_draw(false); if (L13.ang === 45) mission(13, 2); };
  if (state.reduceMotion) { landed(); return; }                   // no animation: show the finished flight at once
  const T = 2 * L13.v * Math.sin(L13.ang * DEG) / L13_G, stepFrac = 0.03 * 1.6 / T;   // the flight is played 1.6× faster than real time
  L13.fly = 0;
  L13.timer = setInterval(() => {
    if (!$('#l13svg') || L13.tab !== 'launch') { L13_stop(); return; }
    L13.fly = Math.min(1, L13.fly + stepFrac);
    if (L13.fly >= 1) { L13_stop(); landed(); } else L13_draw(false);
  }, 30);
}

/* ================= LEVEL 14 — SOUND AND WAVES (added in V4) =================
   A pure note is a sine wave. This level draws the wave and can also PLAY it, using the
   browser's built-in Web Audio (no library, nothing downloaded, nothing recorded).
   Three tabs: one note, mixing harmonics, and beats between two close notes. */
const L14 = { tab: 'note', f: 220, amp: 0.6, h: [1, 0, 0, 0], delta: 6, playing: false, stopTimer: null };
const L14_AUDIO = { ctx: null, master: null, oscs: [] };          // the sound engine, created the first time Play is pressed
const L14_NOTES = [['C', 262], ['D', 294], ['E', 330], ['F', 349], ['G', 392], ['A', 440], ['B', 494], ['C', 523]];
const L14_BASE = 220;                                             // the main frequency used in the "mix" tab (Hz)
const L14_PRESETS = { pure: [1, 0, 0, 0], reed: [1, 0, 0.35, 0], bright: [1, 0.5, 0.35, 0.25] };
const L14_canPlay = () => !!(window.AudioContext || window.webkitAudioContext);

/* The sine waves that make up the current sound: a list of {f: frequency in Hz, g: strength}. */
function L14_parts() {
  if (L14.tab === 'mix') return L14.h.map((a, i) => ({ f: L14_BASE * (i + 1), g: a }));
  if (L14.tab === 'beats') return [{ f: 440, g: 0.5 }, { f: 440 + L14.delta, g: 0.5 }];
  return [{ f: L14.f, g: L14.amp }];
}
function L14_button() { const b = $('#l14play'); if (b) b.textContent = L14.playing ? '■ ' + t('L14_stop') : '▶ ' + t('L14_play'); }
function L14_stopSound() {
  clearTimeout(L14.stopTimer); L14.stopTimer = null;
  const A = L14_AUDIO;
  if (A.ctx && A.master) {
    try { A.master.gain.setTargetAtTime(0, A.ctx.currentTime, 0.03); } catch (e) {}          // fade out, so there is no click
    A.oscs.forEach(o => { try { o.osc.stop(A.ctx.currentTime + 0.2); } catch (e) {} });
  }
  A.oscs = []; L14.playing = false; L14_button();
}
function L14_startSound() {
  if (!L14_canPlay()) return;
  L14_stopSound();
  const A = L14_AUDIO;
  try {
    if (!A.ctx) {
      A.ctx = new (window.AudioContext || window.webkitAudioContext)();
      A.master = A.ctx.createGain(); A.master.gain.value = 0; A.master.connect(A.ctx.destination);
    }
    if (A.ctx.state === 'suspended') A.ctx.resume();
    L14_parts().forEach(p => {                                    // one sine-wave generator for each part of the sound
      const osc = A.ctx.createOscillator(), gain = A.ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = p.f; gain.gain.value = p.g;
      osc.connect(gain); gain.connect(A.master); osc.start();
      A.oscs.push({ osc, gain });
    });
    A.master.gain.cancelScheduledValues(A.ctx.currentTime);
    A.master.gain.setTargetAtTime(0.16, A.ctx.currentTime, 0.03);  // the overall volume is kept gentle on purpose
  } catch (e) { return; }
  L14.playing = true; L14_button();
  L14.stopTimer = setTimeout(L14_stopSound, L14.tab === 'beats' ? 8000 : 4000);   // sounds stop by themselves
}
function L14_updateSound() {                                       // sliders moved while the sound is playing
  const A = L14_AUDIO; if (!L14.playing || !A.ctx) return;
  L14_parts().forEach((p, i) => {
    if (!A.oscs[i]) return;
    A.oscs[i].osc.frequency.setTargetAtTime(p.f, A.ctx.currentTime, 0.02);
    A.oscs[i].gain.gain.setTargetAtTime(p.g, A.ctx.currentTime, 0.02);
  });
}

function L14_draw(byStudent) {
  const svg = $('#l14svg'); if (!svg) return;
  const X0 = 46, X1 = 500, MID = 150, lab = (x, y, s, cls, anchor) => '<text class="' + (cls || 'f-muted') + '" font-size="13" text-anchor="' + (anchor || 'middle') + '" x="' + x.toFixed(1) + '" y="' + y + '">' + s + '</text>';
  let g = '<rect class="s-bg" width="520" height="300"/>', out = '';
  const frame = (ticks) => {                                       // the axes: time across, air pressure up and down
    let s = '<path class="s-grid" d="' + ticks.map(k => 'M' + k[0].toFixed(1) + ' 30V270').join('') + 'M' + X0 + ' 40H' + X1 + 'M' + X0 + ' 260H' + X1 + '"/>' +
            '<path class="s-axis" d="M' + X0 + ' ' + MID + 'H' + X1 + 'M' + X0 + ' 30V270"/>';
    ticks.forEach(k => { s += lab(k[0], 288, k[1]); });
    return s + lab(X1, 24, t('L14_time') + ' →', 'f-muted', 'end');
  };

  if (L14.tab === 'note') {
    const win = 0.02, X = s => X0 + s / win * (X1 - X0), Y = v => MID - v * 110, T = 1 / L14.f;
    g += frame([0, 5, 10, 15, 20].map(ms => [X(ms / 1000), ms + ' ms'])) +
         '<path class="s-line s-sin" d="' + plotPath(s => L14.amp * Math.sin(2 * Math.PI * L14.f * s), 0, win, X, Y, 9, 520) + '"/>' +
         '<path class="s-ink s-thin s-gold" d="M' + X(0).toFixed(1) + ' 262v8H' + X(T).toFixed(1) + 'v-8"/>' + lab((X(0) + X(T)) / 2 + 20, 252, 'T', 'f-gold');
    out = '<div class="read"><div><small>' + t('L14_freq') + '</small><b>' + L14.f + ' Hz</b></div>' +
          '<div><small class="c-hyp">' + t('L14_periodIs') + ' (T)</small><b>' + fmt(T * 1000, 2) + ' ms</b></div></div>' +
          '<div class="mathline">' + tex('y=A\\sin(2\\pi f\\,t),\\qquad T=\\dfrac{1}{f}=\\dfrac{1}{' + L14.f + '}\\text{ s}=' + fmt(T * 1000, 2) + '\\text{ ms}') + '</div>';
    $('#l14fV').textContent = L14.f + ' Hz'; $('#l14ampV').textContent = Math.round(L14.amp * 100) + '%';
    $$('[data-note]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.note === L14.f));
  }

  if (L14.tab === 'mix') {
    const win = 2 / L14_BASE, X = s => X0 + s / win * (X1 - X0), total = Math.max(1, L14.h.reduce((a, b) => a + b, 0)), Y = v => MID - v * 110 / total;
    const cols = ['cos', 'tan', 'gold', 'sin'];
    g += frame([0, 0.25, 0.5, 0.75, 1].map(k => [X(k * win), fmt(k * win * 1000, 1) + ' ms']));
    L14.h.forEach((a, i) => { if (a > 0) g += '<path class="s-thin s-' + cols[i] + '" opacity=".75" d="' + plotPath(s => a * Math.sin(2 * Math.PI * L14_BASE * (i + 1) * s), 0, win, X, Y, 9, 300) + '"/>'; });
    g += '<path class="s-line s-hyp" d="' + plotPath(s => L14.h.reduce((sum, a, i) => sum + a * Math.sin(2 * Math.PI * L14_BASE * (i + 1) * s), 0), 0, win, X, Y, 9, 400) + '"/>' +
         lab(X1, 48, '━ ' + t('L14_sum'), 'f-hyp', 'end');
    const terms = L14.h.map((a, i) => a > 0 ? (a === 1 ? '' : fmt(a, 2)) + '\\sin ' + (i ? i + 1 : '') + 'x' : '').filter(Boolean);
    out = '<div class="mathline">' + tex('y=' + (terms.length ? terms.join('+') : '0') + ',\\qquad x=2\\pi\\cdot ' + L14_BASE + '\\,t') + '</div>';
    L14.h.forEach((a, i) => { const el = $('#l14h' + i + 'V'); if (el) el.textContent = Math.round(a * 100) + '%'; });
  }

  if (L14.tab === 'beats') {
    const X = s => X0 + s * (X1 - X0), Y = v => MID - v * 110, env = s => Math.abs(Math.cos(Math.PI * L14.delta * s));
    const upper = plotPath(env, 0, 1, X, Y, 9, 400);
    let lower = '';
    for (let i = 400; i >= 0; i--) lower += 'L' + X(i / 400).toFixed(1) + ' ' + Y(-env(i / 400)).toFixed(1);
    g += frame([0, 0.25, 0.5, 0.75, 1].map(k => [X(k), k + ' s'])) +
         '<path fill="var(--hyp)" opacity=".35" d="' + upper + lower + 'Z"/>' +
         '<path class="s-line s-hyp" d="' + upper + '"/><path class="s-line s-hyp" d="' + plotPath(s => -env(s), 0, 1, X, Y, 9, 400) + '"/>';
    out = '<div class="read"><div><small>1</small><b>440 Hz</b></div><div><small>2</small><b>' + fmt(440 + L14.delta, 1) + ' Hz</b></div>' +
          '<div><small class="c-hyp">' + t('L14_beatsPerSec') + '</small><b class="c-hyp">' + fmt(Math.abs(L14.delta), 1) + '</b></div></div>' +
          '<div class="mathline">' + tex('\\sin a+\\sin b=2\\sin\\!\\left(\\dfrac{a+b}{2}\\right)\\cos\\!\\left(\\dfrac{a-b}{2}\\right)') + '</div>' +
          '<p class="says">' + t('L14_beatsNote') + '</p>';
    $('#l14dV').textContent = fmt(440 + L14.delta, 1) + ' Hz';
    if (byStudent && L14.delta === 4) mission(14, 2);
  }
  svg.innerHTML = g;
  $('#l14out').innerHTML = out;
}

function L14_toggle() {                                            // the Play / Stop button
  if (L14.playing) { L14_stopSound(); return; }
  L14_startSound();
  if (L14.tab === 'note' && L14.f === 440) mission(14, 0);
  if (L14.tab === 'mix' && L14.h.slice(1).filter(a => a > 0).length >= 2) mission(14, 1);
}

LEVELS[14] = {
  steps: [
    { key: 'L14_s0' },
    { key: 'L14_s1', act() { Object.assign(L14, { tab: 'note', f: 220 }); renderLevel(); } },
    { key: 'L14_s2', predict: true, act() { Object.assign(L14, { tab: 'note', f: 220 }); renderLevel(); } },
    { key: 'L14_s3', act() { Object.assign(L14, { tab: 'note', f: 440 }); renderLevel(); } },
    { key: 'L14_s4', act() { Object.assign(L14, { tab: 'mix', h: L14_PRESETS.bright.slice() }); renderLevel(); } },
    { key: 'L14_s5', act() { Object.assign(L14, { tab: 'beats', delta: 4 }); renderLevel(); } }
  ],
  leave: L14_stopSound,
  render(root) {
    L14_stopSound();
    const tab = L14.tab;
    const slider = (id, label, min, max, step, value) => '<label class="sl" for="' + id + '">' + label + ' <span id="' + id + 'V"></span></label>' +
      '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '">';
    const controls = tab === 'note'
      ? slider('l14f', t('L14_freq'), 110, 880, 1, L14.f) + slider('l14amp', t('L14_amp'), 0.1, 1, 0.05, L14.amp) +
        '<h3>' + t('L14_notes') + '</h3><div class="tabs">' + L14_NOTES.map(n => '<button class="btn small" data-note="' + n[1] + '">' + n[0] + ' <small>' + n[1] + '</small></button>').join('') + '</div>'
      : tab === 'mix'
      ? L14.h.map((a, i) => slider('l14h' + i, t('L14_harmonic', { n: i + 1 }) + ' (' + L14_BASE * (i + 1) + ' Hz)', 0, 1, 0.05, a)).join('') +
        '<div class="tabs" style="margin-top:10px">' + [['pure', 'L14_presetPure'], ['reed', 'L14_presetReed'], ['bright', 'L14_presetBright']].map(p => '<button class="btn small" data-preset="' + p[0] + '">' + t(p[1]) + '</button>').join('') + '</div>'
      : slider('l14d', t('L14_second'), 0, 10, 0.5, L14.delta);
    root.innerHTML =
      '<div class="lvl"><div class="card viz"><svg id="l14svg" class="static" viewBox="0 0 520 300" role="img" aria-label="' + t('L14_aria_' + tab) + '"></svg></div>' +
      '<div class="card"><h2>' + t('L14_title') + '</h2>' +
        tabsHTML('tab', [{ id: 'note', label: t('L14_tabNote') }, { id: 'mix', label: t('L14_tabMix') }, { id: 'beats', label: t('L14_tabBeats') }], tab) +
        '<p class="says">' + t('L14_intro_' + tab) + '</p>' +
        (L14_canPlay() ? '<div class="row"><button class="btn gold" id="l14play"></button></div>' : '<div class="note">' + t('L14_noAudio') + '</div>') +
        controls + '<div id="l14out"></div>' +
      '</div></div>';
    L14_button();
    $$('[data-tab]', root).forEach(b => b.addEventListener('click', () => { L14.tab = b.dataset.tab; renderLevel(); }));
    if ($('#l14play')) $('#l14play').addEventListener('click', L14_toggle);
    const live = () => { L14_draw(true); L14_updateSound(); };
    if (tab === 'note') {
      $('#l14f').addEventListener('input', e => { L14.f = +e.target.value; live(); if (L14.playing && L14.f === 440) mission(14, 0); });
      $('#l14amp').addEventListener('input', e => { L14.amp = +e.target.value; live(); });
      $$('[data-note]', root).forEach(b => b.addEventListener('click', () => { L14.f = +b.dataset.note; $('#l14f').value = L14.f; live(); if (L14.playing && L14.f === 440) mission(14, 0); }));
    } else if (tab === 'mix') {
      L14.h.forEach((a, i) => $('#l14h' + i).addEventListener('input', e => { L14.h[i] = +e.target.value; live(); }));
      $$('[data-preset]', root).forEach(b => b.addEventListener('click', () => {
        L14.h = L14_PRESETS[b.dataset.preset].slice();
        L14.h.forEach((a, i) => { $('#l14h' + i).value = a; });
        live();
      }));
    } else {
      $('#l14d').addEventListener('input', e => { L14.delta = +e.target.value; live(); });
    }
    L14_draw(false);
  }
};

L7_MAKERS.push(
  () => { const n = pick([110, 220, 330, 440]);
    return Object.assign({ level: 14, key: 'q_octave', vars: { n }, hint: 'h_octave' }, options(2 * n + ' Hz', [n / 2 + ' Hz', 3 * n + ' Hz', (n + 100) + ' Hz'], 'txt')); },
  () => { const v = pick([[440, 444], [300, 306], [256, 259], [500, 510]]), d = v[1] - v[0];
    return Object.assign({ level: 14, key: 'q_beats', vars: { a: v[0], b: v[1] }, hint: 'h_beats' }, options(String(d), [String(d * 2), String((v[0] + v[1]) / 2), String(v[0] + v[1])], 'txt')); }
);

/* ================= START-UP ================= */
function applySettings() {
  document.documentElement.dataset.theme = state.theme;
  document.body.classList.toggle('projector', state.projector);
  document.body.classList.toggle('reduce-motion', state.reduceMotion);
  $('#themeBtn').setAttribute('aria-pressed', state.theme === 'dark');
  $('#projBtn').setAttribute('aria-pressed', state.projector);
  $('#motionBtn').setAttribute('aria-pressed', state.reduceMotion);
}
function init() {
  // Language: switch the words only. XP, badges and slider positions stay as they are.
  $('#lang').addEventListener('change', e => { state.lang = e.target.value; renderAll(); });
  $('#themeBtn').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applySettings(); });
  $('#projBtn').addEventListener('click', () => { state.projector = !state.projector; applySettings(); });
  $('#motionBtn').addEventListener('click', () => { state.reduceMotion = !state.reduceMotion; applySettings(); });
  $('#map').addEventListener('click', e => { const b = e.target.closest('[data-level]'); if (b) goLevel(+b.dataset.level); });
  $('#prevStep').addEventListener('click', () => gotoStep(-1));
  $('#nextStep').addEventListener('click', () => gotoStep(1));
  applySettings();
  renderAll();
}
init();
</script>
